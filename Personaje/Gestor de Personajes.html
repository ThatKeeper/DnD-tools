function personCard(q){const qr=calc(q).r,classes=[...new Set(picks(q).filter(Boolean).map(v=>v.k))],portrait=imageURL(q.portraitId);return `<article class="card hero-card ${portrait?'has-portrait':''}">${portrait?`<img class="hero-portrait" src="${esc(portrait)}" alt="Retrato de ${esc(q.name||'personaje')}">`:''}<div><div class="hero-level">Nivel ${Math.min(MAX_LEVEL,q.lvl||0)} · ${esc(q.race||'Sin raza')}</div><div class="hero-name">${esc(q.name||'Sin nombre')}</div><div class="hero-meta">${esc([q.job,...classes].filter(Boolean).join(' · ')||'Sin clase asignada')}</div></div><div class="bar"><span class="mu">♥ ${qr.con.tot*5+(+q.hpx||0)} vida</span><span class="mu">✦ ${xpT(q)} XP</span></div><div class="bar">${B('profile','Explorar perfil',q.id,'on')}${B('editchar','Ficha completa',q.id)}</div></article>`}
function postPreview(post){const links=(post.characterIds||[]).map(id=>B('profile',esc(personName(id)),id)).join(' '),images=(post.mediaIds||[]).map(id=>`<button class="gallery-thumb" data-a="zoom" data-i="${esc(id)}"><img src="${esc(imageURL(id))}" alt="Imagen adjunta"></button>`).join('');return `<article class="card post-card"><div class="post-meta">${esc(post.category||'Publicación')} · ${new Date(post.createdAt||Date.now()).toLocaleDateString('es')}</div><h3>${esc(post.title||'Sin título')}</h3><div class="post-body">${esc(post.body||'').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}</div>${post.tags?.length?`<div class="post-meta">${post.tags.map(tag=>'#'+esc(tag)).join(' ')}</div>`:''}<div class="gallery-grid">${images}</div><div class="post-links">${links}</div><details><summary>Comentarios (${S.comments.filter(item=>item.postId==post.id).length})</summary><div class="comment-thread">${commentsMarkup(post.id)}</div><textarea id="comment-${esc(post.id)}" maxlength="2000" placeholder="Escribe un comentario…"></textarea>${B('comment','Comentar',post.id)}</details>${B('delpost','Eliminar publicación',post.id)}</article>`}
function eventPreview(entry){return `<article class="card"><div class="post-meta">${esc(entry.kind||'Acontecimiento')} · ${new Date(entry.createdAt||Date.now()).toLocaleDateString('es')}${entry.place?' · '+esc(entry.place):''}</div><h3>${esc(entry.title||'Sin título')}</h3><p>${esc(entry.body||'')}</p><div class="post-links">${(entry.characterIds||[]).map(id=>B('profile',esc(personName(id)),id)).join(' ')}</div>${B('delentry','Eliminar entrada',entry.id)}</article>`}

const MAX_IMAGE_BYTES=12*1024*1024,IMAGE_TYPES=['image/jpeg','image/png','image/webp','image/gif','image/avif'];
async function storeImages(files,ownerId,kind){const list=Array.from(files);if(list.some(f=>!IMAGE_TYPES.includes(f.type)||f.size>MAX_IMAGE_BYTES))throw new Error('Usa JPG, PNG, WebP, GIF o AVIF de hasta 12 MB por imagen.');const stored=[];try{for(const file of list){const record={id:newId('image'),ownerId,kind,name:file.name,type:file.type,size:file.size,createdAt:Date.now(),blob:file.slice(0,file.size,file.type)};await window.ArkeArchiveDB.putMedia(record);MEDIA_URLS[record.id]=URL.createObjectURL(record.blob);stored.push(record)}return stored}catch(error){await Promise.all(stored.map(record=>window.ArkeArchiveDB.deleteMedia(record.id)));throw error}}
function blobDataURL(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error||new Error('No se pudo leer un archivo de imagen.'));reader.readAsDataURL(blob)})}
function dataURLBlob(value){const match=/^data:(image\/(?:jpeg|png|webp|gif|avif));base64,([A-Za-z0-9+/=]+)$/.exec(value||'');if(!match)throw new Error('La copia contiene una imagen no válida.');const bytes=Uint8Array.from(atob(match[2]),char=>char.charCodeAt(0));return new Blob([bytes],{type:match[1]})}
async function exportArchive(){const media=await window.ArkeArchiveDB.readAll(await window.ArkeArchiveDB.open(),'media'),images=await Promise.all(media.map(async item=>({id:item.id,ownerId:item.ownerId,kind:item.kind,name:item.name,type:item.type,size:item.size,createdAt:item.createdAt,data:await blobDataURL(item.blob)}))),backup={format:'arke-archive',version:1,exportedAt:Date.now(),chars:S.chars,posts:S.posts,comments:S.comments,relationships:S.relationships,events:S.events,settings:S.settings,media:images},blob=new Blob([JSON.stringify(backup)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='arke-archivo-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);announce('Copia completa descargada. Guárdala fuera de este navegador.')}
async function importArchiveFile(file){if(!file||file.size>150*1024*1024)throw new Error('La copia debe pesar menos de 150 MB.');const data=JSON.parse(await file.text());if(data.format!='arke-archive'||data.version!=1||!Array.isArray(data.chars)||!Array.isArray(data.media)||!Array.isArray(data.posts)||!Array.isArray(data.comments)||!Array.isArray(data.relationships)||!Array.isArray(data.events)||!data.settings||typeof data.settings!='object')throw new Error('El archivo no tiene un formato de copia compatible.');const ids=new Set(),media=[];for(const item of data.media){if(!item.id||ids.has(item.id))throw new Error('La copia contiene identificadores de imagen repetidos.');ids.add(item.id);const blob=dataURLBlob(item.data);if(blob.size>MAX_IMAGE_BYTES)throw new Error('Una imagen de la copia supera el límite de 12 MB.');media.push({id:item.id,ownerId:item.ownerId,kind:item.kind,name:item.name,type:blob.type,size:blob.size,createdAt:item.createdAt,blob})}if(!confirm('Esto reemplazará personajes, publicaciones, relaciones e imágenes de este navegador. ¿Continuar?'))return;const next={sel:data.chars[0]?.id||null,chars:data.chars,posts:data.posts,comments:data.comments,relationships:data.relationships,events:data.events,settings:data.settings};await window.ArkeArchiveDB.replaceArchive(next,media);Object.values(MEDIA_URLS).forEach(url=>URL.revokeObjectURL(url));MEDIA_URLS={};cacheMedia(media);S=next;if(!S.chars.length)VIEW='hub';save();announce('Archivo restaurado correctamente.');render()}
function selectedIds(id){const select=document.getElementById(id);return select?Array.from(select.selectedOptions).map(option=>option.value):[]}
function openImage(id){const src=imageURL(id);if(!src){announce('No se pudo abrir la imagen guardada.',true);return}const overlay=document.createElement('div'),image=document.createElement('img'),close=document.createElement('button');overlay.className='image-viewer';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','Vista ampliada');image.src=src;image.alt='Imagen ampliada';close.type='button';close.textContent='Cerrar';close.addEventListener('click',()=>overlay.remove());overlay.addEventListener('click',event=>{if(event.target===overlay)overlay.remove()});overlay.addEventListener('keydown',event=>{if(event.key==='Escape')overlay.remove()});overlay.append(image,close);document.body.appendChild(overlay);close.focus()}
async function removeCharacter(id){const media=await window.ArkeArchiveDB.readAll(await window.ArkeArchiveDB.open(),'media');for(const item of media.filter(record=>record.ownerId==id)){await window.ArkeArchiveDB.deleteMedia(item.id);URL.revokeObjectURL(MEDIA_URLS[item.id]);delete MEDIA_URLS[item.id]}S.chars=S.chars.filter(q=>q.id!=id);S.relationships=S.relationships.filter(rel=>rel.fromId!=id&&rel.toId!=id);S.posts.forEach(post=>{post.characterIds=(post.characterIds||[]).filter(cid=>cid!=id)});S.events.forEach(entry=>{entry.characterIds=(entry.characterIds||[]).filter(cid=>cid!=id)});if(S.sel==id)S.sel=S.chars[0].id;save()}
